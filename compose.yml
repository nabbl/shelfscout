# Generated by CI; source commit: a3dc79d0e7f5ee54dc25e3eb9fe0d7c8f3f0c821
name: shelfscout

x-shelfscout: &shelfscout
  image: ghcr.io/nabbl/shelfscout@sha256:e55bdc3e57379a718ac8f870fafde9885ebac094cf972188c3cc7fe7cfca3679
  pull_policy: always
  env_file:
    - path: .env
      required: false
  environment:
    NODE_ENV: production
    DEMO_MODE: "false"
    DATA_DIR: /data
    SHELFSCOUT_DB: /data/shelfscout.sqlite
  volumes:
    - shelfscout-data:/data
  init: true
  restart: unless-stopped
  stop_grace_period: 60s

services:
  web:
    <<: *shelfscout
    ports:
      - "${SHELFSCOUT_BIND_ADDRESS:-0.0.0.0}:${SHELFSCOUT_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
  worker:
    <<: *shelfscout
    command: ["node", "--import", "tsx", "server/worker.ts"]
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      DATA_DIR: /data
      SHELFSCOUT_DB: /data/shelfscout.sqlite
      # Fixed worker-side path; only the worker needs completed-file access.
      SHELFSCOUT_INCOMING_DIR: /incoming
    volumes:
      - shelfscout-data:/data
      # Set an absolute existing host directory shared with Shelfmark and BookOrbit.
      # The empty fallback keeps recommendation-only installations working.
      - ${SHELFSCOUT_INCOMING_HOST_DIR:-shelfscout-incoming-unconfigured}:/incoming:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  shelfscout-incoming-unconfigured:
  shelfscout-data:
