services:
  web:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    volumes: ["shelfscout-data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 5
  worker:
    build: .
    env_file: .env
    command: ["./node_modules/.bin/tsx", "server/worker.ts"]
    volumes: ["shelfscout-data:/data"]
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
volumes:
  shelfscout-data:

