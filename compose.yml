# Generated by CI; source commit: f4bba9357b5f4a067569b7b9f3f123c742e91f80
name: shelfscout

x-shelfscout: &shelfscout
  image: ghcr.io/nabbl/shelfscout@sha256:cbecccb8e2b3a520bfed9f4cc240d7385a5bb34e2ed06f1c3318fa29bfa82072
  pull_policy: always
  env_file:
    - path: .env
      required: false
  environment:
    NODE_ENV: production
    DEMO_MODE: "false"
    DATA_DIR: /data
    SHELFSCOUT_DB: /data/shelfscout.sqlite
  volumes:
    - shelfscout-data:/data
  init: true
  restart: unless-stopped
  stop_grace_period: 60s

services:
  web:
    <<: *shelfscout
    ports:
      - "${SHELFSCOUT_BIND_ADDRESS:-0.0.0.0}:${SHELFSCOUT_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
  worker:
    <<: *shelfscout
    command: ["node", "--import", "tsx", "server/worker.ts"]
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      DATA_DIR: /data
      SHELFSCOUT_DB: /data/shelfscout.sqlite
      # Fixed worker-side path; only the worker needs completed-file access.
      SHELFSCOUT_INCOMING_DIR: /incoming
    volumes:
      - shelfscout-data:/data
      # Set an absolute existing host directory shared with Shelfmark and BookOrbit.
      # The empty fallback keeps recommendation-only installations working.
      - ${SHELFSCOUT_INCOMING_HOST_DIR:-shelfscout-incoming-unconfigured}:/incoming:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  shelfscout-incoming-unconfigured:
  shelfscout-data:
