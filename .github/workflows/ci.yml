name: CI and GHCR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shelfscout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install exactly the locked dependencies
        run: npm ci --foreground-scripts --no-audit --no-fund
      - name: Audit dependencies (including tools shipped in the image)
        run: npm audit --audit-level=high
      - name: Validate workflow and Compose files
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
          python3 scripts/ci/check-compose.py
          bash -n scripts/ci/container-smoke.sh
      - run: npm run lint
      - name: Generate route types and type-check
        run: |
          npx next typegen
          npm run typecheck
      - name: Unit and database migration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Demo browser tests (desktop and mobile)
        run: npm run test:browser -- --workers=1 --forbid-only --reporter=line,html
      - name: Authenticated browser tests with isolated synthetic data
        run: npm run test:browser:live -- --forbid-only --reporter=line,html
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  image:
    name: Container checks (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the production image natively
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          pull: true
          load: true
          tags: shelfscout:ci-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
          # Docker tar artifacts carry the exact tested image into the publishing job.
          provenance: false
      - name: Smoke-test web and worker without external network access
        env:
          TEST_IMAGE: shelfscout:ci-${{ matrix.arch }}
        run: bash scripts/ci/container-smoke.sh "$TEST_IMAGE"
      - name: Reject fixable high and critical image vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: shelfscout:ci-${{ matrix.arch }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: json
          output-file: ${{ runner.temp }}/image-scan.json
      - name: Save image scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-scan-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-scan.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Export the checked image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save "shelfscout:ci-$ARCH" -o "$RUNNER_TEMP/image-$ARCH.tar"
      - name: Transfer checked image to publisher
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checked-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

  publish:
    name: Publish checked images to GHCR
    needs: [checks, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: checked-image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Refuse to publish an outdated main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push exact checked images and assemble multi-platform tags
        id: publish
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for arch in amd64 arm64; do
            docker load -i "$RUNNER_TEMP/images/image-$arch.tar"
            docker tag "shelfscout:ci-$arch" "$image:sha-$GITHUB_SHA-$arch"
            docker push "$image:sha-$GITHUB_SHA-$arch"
          done
          docker buildx imagetools create \
            --tag "$image:sha-$GITHUB_SHA" --tag "$image:main" --tag "$image:latest" \
            "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
          digest=$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -er '.digest')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`$image@$digest\` (amd64 and arm64)." >> "$GITHUB_STEP_SUMMARY"

  gitops:
    name: Update digest-pinned GitOps manifest
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate deployment manifest from the published digest
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          digest = os.environ['DIGEST']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest)
          source = Path('deploy/compose.ghcr.yml').read_text()
          default = '${SHELFSCOUT_IMAGE:-ghcr.io/nabbl/shelfscout:main}'
          assert source.count(default) == 1
          # Pin both services through the shared anchor. Roll back through Git history.
          rendered = source.replace(default, os.environ['IMAGE'] + '@' + digest)
          Path(os.environ['RUNNER_TEMP'], 'compose.yml').write_text(
              '# Generated by CI; source commit: ' + os.environ['GITHUB_SHA'] + '\n' + rendered)
          PY
          docker compose -f "$RUNNER_TEMP/compose.yml" config --quiet
      - name: Commit manifest to the deployment branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          branch=codex/ghcr-deploy
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git switch -C "$branch" FETCH_HEAD
          else
            git switch --orphan "$branch"
          fi
          cp "$RUNNER_TEMP/compose.yml" compose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compose.yml
          if ! git diff --cached --quiet; then
            git commit -m "Deploy image for $GITHUB_SHA"
            git push origin "HEAD:refs/heads/$branch"
          fi
          echo 'Arcane GitOps: branch codex/ghcr-deploy, Compose path compose.yml.' >> "$GITHUB_STEP_SUMMARY"
